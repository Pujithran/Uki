<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

    </head>

    <body style="background-color: rgb(0, 0, 0);">

        <h1 style="text-align: center; color: white; margin-top: 100px; margin-bottom: 50px;">Student Task Manager</h1>

        <div style="display: grid; place-items: center; min-height: 300px;">
            <div style="background-color: rgb(51, 51, 51); width: 300px; border-radius: 30px; border: 1px rgb(255, 128, 97) solid; display: grid; place-items: center; margin-bottom: 30px;">
                <h3 style="color: white;">
                    Enter your task
                </h3>
                <input type="text" style="height: 20px; margin-bottom: 20px; border-radius: 7px; width: 200px; background-color: grey; border: 1px solid black;">
                <button style="margin-bottom: 20px; background-color: rgb(255, 117, 81); border-radius: 5px; width: 80px; height: 30px; font-weight: bold;">Add Task</button>
            </div>

            <div style="background-color: rgb(51, 51, 51); width: 300px; border-radius: 30px; border: 1px rgb(255, 128, 97) solid; display: grid; place-items: center;">
                <h3 style="color: white;">
                    Your Tasks
                </h3>
                <button style="margin-bottom: 20px; background-color: rgb(255, 117, 81); border-radius: 5px; width: 100px; height: 30px;  font-weight: bold;">Load Tasks</button>
                <div style="background-color: grey; width: 200px; height: 50px; border-radius: 5px; border: 1px black solid; margin-bottom: 20px;"></div>
            </div>

        </div>

    </body>

</html>
