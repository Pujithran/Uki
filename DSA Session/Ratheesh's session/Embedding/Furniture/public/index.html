<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Chat</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;margin:20px}
        #chat{border:1px solid #ddd;padding:12px;height:300px;overflow:auto;margin-bottom:8px}
        .user{color:#0b63ff}
        .ai{color:#006400}
        #message{width:80%}
    </style>
</head>
<body>
    <h1>AI Chat</h1>
    <div id="chat"></div>
    <input id="message" placeholder="Ask something..." />
    <button id="send">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('message');
            const chat = document.getElementById('chat');
            const message = input.value.trim();
            if (!message) return;
            chat.innerHTML += `<p class="user"><b>You:</b> ${message}</p>`;
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                chat.innerHTML += `<p class="ai"><b>AI:</b> ${data.reply}</p>`;
                chat.scrollTop = chat.scrollHeight;
            } catch (err) {
                chat.innerHTML += `<p style="color:#b00"><b>Error:</b> ${err.message}</p>`;
            }
        }

        document.getElementById('send').addEventListener('click', sendMessage);
        document.getElementById('message').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });
    </script>
</body>
</html>
