<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fibonacci Tree</title>
<style>
  :root{
    --bg: #faf7f0;
    --line: #b9c6d6;
    --label: #1f3a5f;
    --bark-dark: #6b4a34;
    --bark-light: #8a6244;
    --ink: #2b2b2b;
  }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--ink);
  }
  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  h1{
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  .sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    color: #666;
    margin: 0 0 18px;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap: wrap;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .controls label{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .controls input[type=range]{
    width: 140px;
  }
  .controls button{
    font-family: inherit;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #c9beac;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .controls button:hover{ background: #f2ede2; }
  canvas{
    display:block;
    width: 100%;
    height: auto;
    background: var(--bg);
  }
  .frame{
    border: 1px solid #e3ddcc;
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fibonacci Tree</h1>
  <p class="sub">Every branch's value equals the sum of its two children — pure Fibonacci recursion, drawn as a tree.</p>

  <div class="controls">
    <label>Depth (n): <input id="depthSlider" type="range" min="4" max="10" value="7"><span id="depthVal">7</span></label>
    <label>Jitter seed: <input id="seedSlider" type="range" min="1" max="200" value="42"><span id="seedVal">42</span></label>
    <button id="regen">Redraw</button>
  </div>

  <div class="frame">
    <canvas id="tree" width="860" height="620"></canvas>
  </div>
</div>

<script>
// ---------- Fibonacci helper ----------
function fib(n){
  // fib(0) = 1, fib(1) = 1, fib(2) = 2, fib(3) = 3, fib(4) = 5 ...
  if(n <= 1) return 1;
  let a=1,b=1;
  for(let i=2;i<=n;i++){ const c=a+b; a=b; b=c; }
  return b;
}

// ---------- seeded PRNG for a stable but adjustable organic look ----------
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const canvas = document.getElementById('tree');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const depthSlider = document.getElementById('depthSlider');
const seedSlider = document.getElementById('seedSlider');
const depthVal = document.getElementById('depthVal');
const seedVal = document.getElementById('seedVal');

function draw(){
  const rootN = parseInt(depthSlider.value, 10);
  const seed = parseInt(seedSlider.value, 10);
  depthVal.textContent = rootN;
  seedVal.textContent = seed;
  const rand = mulberry32(seed * 7919 + 13);

  ctx.clearRect(0,0,W,H);

  // ---- background row guide lines labelled with the Fibonacci sequence ----
  const rows = [];
  for(let i=0;i<=rootN;i++) rows.push(fib(i));
  const marginTop = 40, marginBottom = 70;
  const usableH = H - marginTop - marginBottom;
  const rowH = usableH / rootN;

  ctx.textBaseline = 'middle';
  for(let i=0;i<=rootN;i++){
    const y = H - marginBottom - i*rowH;
    ctx.strokeStyle = '#c3d0de';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, y);
    ctx.lineTo(W-90, y);
    ctx.stroke();

    ctx.fillStyle = '#3a5a86';
    ctx.font = '600 20px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(rows[i], W-70, y - rowH/2 + rowH/2);
  }
  // bottom-most closing line
  ctx.strokeStyle = '#c3d0de';
  ctx.beginPath();
  ctx.moveTo(30, H - marginBottom + rowH);
  ctx.lineTo(W-90, H - marginBottom + rowH);
  ctx.stroke();

  // ---- recursive branch drawing ----
  const startX = W/2 - 40;
  const startY = H - marginBottom + rowH/2;
  const baseAngle = -Math.PI/2; // straight up

  function branchColor(n){
    // thicker/older branches darker, thin tips lighter
    const t = Math.max(0, Math.min(1, n / rootN));
    const r = Math.round(107 + (138-107)*(1-t));
    const g = Math.round(74 + (98-74)*(1-t));
    const b = Math.round(52 + (68-52)*(1-t));
    return `rgb(${r},${g},${b})`;
  }

  function drawBranch(x, y, angle, n, depth){
    const value = fib(n);
    const len = 16 + n * (usableH / (rootN * 1.6));
    const width = Math.max(1.6, 2 + n * 1.9);

    const jitter = (rand() - 0.5) * 0.12;
    const a = angle + jitter;

    const x2 = x + Math.cos(a) * len;
    const y2 = y + Math.sin(a) * len;

    ctx.strokeStyle = branchColor(n);
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // label near the start of the branch, offset perpendicular
    const perp = a + Math.PI/2;
    const side = (rand() > 0.5) ? 1 : -1;
    const lx = x + Math.cos(a)*10 + Math.cos(perp)*side*11;
    const ly = y + Math.sin(a)*10 + Math.sin(perp)*side*11;

    ctx.fillStyle = '#1f3a5f';
    ctx.font = `600 ${Math.max(11, 10 + n*0.7)}px Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.fillText(value, lx, ly);

    if(n <= 0){
      // leaf: sprout two tiny twigs, purely decorative, both valued 1
      const spread = 0.5 + rand()*0.25;
      [-1,1].forEach(dir=>{
        const ta = a + dir*spread;
        const tx = x2 + Math.cos(ta)*14;
        const ty = y2 + Math.sin(ta)*14;
        ctx.strokeStyle = branchColor(-1);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x2,y2);
        ctx.lineTo(tx,ty);
        ctx.stroke();
        ctx.fillStyle = '#1f3a5f';
        ctx.font = '600 11px Georgia, serif';
        ctx.fillText('1', tx + dir*7, ty - 4);
      });
      return;
    }

    // spread angle narrows with depth for a natural taper
    const spread = 0.30 + (rootN - n) * 0.045 + rand()*0.05;

    // Fibonacci-tree asymmetry: one child keeps full height (n-1),
    // the other terminates sooner (n-2) — this is what produces the
    // uneven branch heights you see in the reference image.
    drawBranch(x2, y2, a - spread, n-1, depth+1);
    drawBranch(x2, y2, a + spread, Math.max(n-2, -1), depth+1);
  }

  drawBranch(startX, startY, baseAngle, rootN, 0);

  // trunk cap label at the very base (root value)
  ctx.fillStyle = '#1f3a5f';
  ctx.font = '600 20px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText(fib(rootN), startX - 60, startY + 4);
}

depthSlider.addEventListener('input', draw);
seedSlider.addEventListener('input', draw);
document.getElementById('regen').addEventListener('click', ()=>{
  seedSlider.value = Math.floor(Math.random()*200)+1;
  draw();
});

draw();
</script>
</body>
</html>
